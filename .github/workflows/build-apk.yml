name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type d

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Capacitor Config
        working-directory: native
        run: |
          if grep -q "YOUR-APP-NAME" capacitor.config.json; then
            echo "::error::Please update capacitor.config.json with your Render URL."
            exit 1
          fi

      - name: Bundle Web App
        run: |
          python3 native/bundle_www.py

      - name: Install npm packages
        working-directory: native
        run: |
          npm install

      - name: Verify Android folder
        working-directory: native
        run: |
          test -d android || { echo "::error::android folder missing"; exit 1; }

      - name: Copy App Icons
        working-directory: native
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          cp -r appicon/mipmap-* android/app/src/main/res/

      - name: Apply Icons
        run: |
          python3 native/apply_icons.py

      - name: Patch AndroidManifest
        working-directory: native
        run: |
          python3 <<'EOF'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          if "xmlns:tools" not in text:
              text = text.replace(
                  "<manifest ",
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )

          if "ACTIVITY_RECOGNITION" not in text:
              text = text.replace(
                  "</manifest>",
                  """
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions"/>
          </manifest>
                  """,
              )

          manifest.write_text(text)
          EOF

      - name: Sync Capacitor
        working-directory: native
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK Exists
        run: |
          test -f native/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthBuddy-APK
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
